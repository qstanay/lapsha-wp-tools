name: lapsha-wp-tools

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/lapsha-wp-tools
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  wp-setup:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/lapsha-wp-tools
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
        set -e
        cd /var/www/html
        WP="wp --allow-root --url=http://localhost:8080"
        n=0
        while [ ! -f wp-includes/version.php ] || [ ! -f wp-config.php ]; do
          n=$$((n + 1))
          if [ "$$n" -ge 90 ]; then
            echo "Timed out waiting for WordPress files."
            exit 1
          fi
          sleep 2
        done
        n=0
        until $$WP core is-installed >/dev/null 2>&1; do
          $$WP core install \
            --url=http://localhost:8080 \
            --title="Lapsha WP Tools Dev" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email || true
          n=$$((n + 1))
          if [ "$$n" -ge 90 ]; then
            echo "Timed out installing WordPress."
            exit 1
          fi
          sleep 2
        done
        $$WP plugin activate lapsha-wp-tools
        echo "WordPress is ready: http://localhost:8080/wp-admin  (admin / admin)"

  wp-cli:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/lapsha-wp-tools
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    profiles:
      - cli
    working_dir: /var/www/html
    entrypoint: ["wp", "--allow-root"]

volumes:
  wordpress_data:
  db_data:
